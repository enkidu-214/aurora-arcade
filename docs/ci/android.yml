name: Android build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'releases/**'
      - 'README.md'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android 16 SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint, and build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintRelease :app:assembleRelease :app:assembleDebug --no-daemon
      - name: Check 16 KB native and APK alignment
        run: |
          python3 scripts/check-apk-alignment.py app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 4 app/build/outputs/apk/release/app-release-unsigned.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-reports
          path: |
            core/build/reports/tests/test/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-release.*
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*unsigned.apk
